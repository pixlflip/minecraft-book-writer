name: Build

# Builds and tests a jar for every supported Minecraft version (one per versions/*.properties).
# Pushing a tag like v1.1.0 also publishes a GitHub release with every jar and a checksum file.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          list=$(ls versions/*.properties | sed 's|versions/||; s|\.properties$||' | sort -V | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Building for: $list"

  build:
    needs: versions
    runs-on: ubuntu-latest
    # Debian's Mesa and Xvfb give every Minecraft version a usable software OpenGL window;
    # the newer stack on the hosted Ubuntu image has no GLX visual 26.3 accepts.
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - name: Install build and display tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl unzip jq \
            xvfb xauth libgl1 libgl1-mesa-dri libegl1 libx11-6 libxext6 libxrender1 libxtst6 \
            libxi6 libxrandr2 libxcursor1 libxxf86vm1 libfreetype6 fontconfig > /dev/null
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test for Minecraft ${{ matrix.mc }}
        # Maven Central sometimes answers 429 under load; one retry after a pause.
        run: ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon || { sleep 60; ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon; }
      - name: Check the packaged mod metadata
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          unzip -p "$jar" fabric.mod.json > fmj.json
          jq -e --arg mc "${{ matrix.mc }}" '.depends.minecraft == $mc' fmj.json
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          jq -e --arg v "$version" '.version == $v' fmj.json
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match mod_version $version"; exit 1; }
          fi
      - name: Smoke test in the real game (Minecraft ${{ matrix.mc }})
        run: |
          # Software OpenGL on a virtual display. A run that never reaches the title screen
          # (window creation failed) is retried once.
          export LIBGL_ALWAYS_SOFTWARE=1
          for attempt in 1 2; do
            xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX +render" ./gradlew runSmokeTest -Pmc=${{ matrix.mc }} --no-daemon > smoketest.log 2>&1 || true
            grep "BOOKWRITER SMOKETEST" smoketest.log || true
            grep -q "BOOKWRITER SMOKETEST PASS" smoketest.log && exit 0
            grep -q "waiting for the game to load" smoketest.log || break
          done
          tail -n 80 smoketest.log
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: bookwriter-mc${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.jar | tee SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versions=$(ls versions/*.properties | sed 's|versions/||; s|\.properties$||' | sort -V | paste -sd ' ' | sed 's/ /, /g')
          cat > notes.md <<EOF
          Book Writer ${GITHUB_REF_NAME} for Fabric.

          **Download the jar that matches your Minecraft version** (the file name ends in \`+mc<version>.jar\`) and put it in your \`mods\` folder. Only Fabric Loader is needed; Fabric API is not required.

          Minecraft versions: ${versions}

          \`SHA256SUMS.txt\` lists the checksum of every jar.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" --draft --title "Book Writer ${GITHUB_REF_NAME#v}" --notes-file notes.md
          gh release upload "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS.txt
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
